<svg xmlns="http://www.w3.org/2000/svg" width="300" height="165" viewBox="0 0 300 165">
  <title>Most Used Languages</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .title { font-size: 18px; font-weight: 600; fill: #f2c14e; }
    .lang { font-size: 11px; font-weight: 400; fill: #ece8e1; }
  </style>
  <rect x="0.5" y="0.5" width="299" height="164" rx="4.5" fill="#0e0d0c"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <mask id="bar"><rect x="0" y="0" width="250" height="8" rx="5" fill="#fff"/></mask>
  <g transform="translate(25,55)" mask="url(#bar)">
    <rect x="0.00" y="0" width="203.78" height="8" fill="#ff8a5b"/><rect x="203.78" y="0" width="22.01" height="8" fill="#4b8bd4"/><rect x="225.79" y="0" width="14.13" height="8" fill="#f34b7d"/><rect x="239.92" y="0" width="5.61" height="8" fill="#f1e05a"/><rect x="245.53" y="0" width="2.59" height="8" fill="#a97bff"/><rect x="248.11" y="0" width="1.89" height="8" fill="#e8e8e8"/>
  </g>
  <g transform="translate(25,80)">
    <g transform="translate(0,0)">
      <circle cx="5" cy="6" r="5" fill="#ff8a5b"/>
      <text x="15" y="10" class="lang">Jupyter Notebook 81.51%</text>
    </g>
    <g transform="translate(150,0)">
      <circle cx="5" cy="6" r="5" fill="#4b8bd4"/>
      <text x="15" y="10" class="lang">Python 8.80%</text>
    </g>
    <g transform="translate(0,25)">
      <circle cx="5" cy="6" r="5" fill="#f34b7d"/>
      <text x="15" y="10" class="lang">C++ 5.65%</text>
    </g>
    <g transform="translate(150,25)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
      <text x="15" y="10" class="lang">JavaScript 2.24%</text>
    </g>
    <g transform="translate(0,50)">
      <circle cx="5" cy="6" r="5" fill="#a97bff"/>
      <text x="15" y="10" class="lang">CSS 1.03%</text>
    </g>
    <g transform="translate(150,50)">
      <circle cx="5" cy="6" r="5" fill="#e8e8e8"/>
      <text x="15" y="10" class="lang">Shell 0.75%</text>
    </g>
  </g>
</svg>
